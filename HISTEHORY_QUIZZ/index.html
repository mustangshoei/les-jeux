<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Histehory Quizz</title>
  <!-- Commun à tous les jeux (dossier ../COMMUN) : sélecteur « Changer de jeu ». S'il manque, le jeu marche sans. -->
  <link rel="stylesheet" href="../COMMUN/jeux.css">
  <link rel="stylesheet" href="css/style.css">
  <!-- Police des titres, commune à tout le site : à changer dans ../COMMUN/police.css (en dernier) -->
  <link rel="stylesheet" href="../COMMUN/police.css">
</head>
<body data-ecran="screen-menu">
<noscript>Cette application nécessite JavaScript.</noscript>

<!-- Changer de jeu (en haut à droite) : rempli par ../COMMUN/jeux.js -->
<div class="jeux-coin" data-jeux-selecteur="histehory"></div>

<!-- Bouton de compte (en haut à gauche) et fenêtre du compte : js/compte.js -->
<button id="compte-bouton" type="button" class="compte-bouton" aria-haspopup="dialog"></button>

<dialog id="compte-dialogue" class="dialogue" aria-labelledby="compte-titre">
  <div class="dialogue-tete">
    <h2 id="compte-titre">Compte</h2>
    <button type="button" class="dialogue-fermer" data-fermer aria-label="Fermer">✕</button>
  </div>
  <p id="compte-aide" class="dialogue-aide"></p>
  <!-- Rempli par js/compte.js : connexion / création de compte, ou gestion du compte connecté -->
  <div id="compte-corps"></div>
</dialog>

<!-- ===================== ACCUEIL ===================== -->
<section id="screen-menu" class="screen page">
  <header class="hero">
    <div class="logo" aria-hidden="true">📜</div>
    <h1>Histehory Quizz</h1>
    <p>Apprenez l'histoire en vous amusant.</p>
  </header>

  <h2 class="accueil-titre">Modes de jeu</h2>
  <!-- Une carte par mode de jeu : remplies par js/menu.js -->
  <div id="menu-modes" class="cards" role="group" aria-label="Modes de jeu"></div>
</section>

<!-- Écrans des modes de jeu : des <section class="screen hidden"> par mode -->

<!-- ===================== QUI EST VENU EN PREMIER ? (js/modes/premier.js) ===================== -->
<section id="screen-premier-config" class="screen page page--centre hidden">
  <div class="config">
    <header class="config__tete">
      <div class="config__icone" aria-hidden="true">🥇</div>
      <h1>Qui est venu en premier ?</h1>
      <p>Deux personnages, une question : lequel est né <strong>avant</strong>, ou <strong>après</strong>, l'autre ? Cliquez sur le bon cadre.</p>
    </header>
    <h2 class="config__titre">Niveau</h2>
    <div id="premier-niveaux" class="choix-ligne" role="group" aria-label="Niveau"></div>
    <h2 class="config__titre">Longueur</h2>
    <div id="premier-longueurs" class="choix-ligne" role="group" aria-label="Longueur"></div>
    <div class="config__actions">
      <button type="button" class="btn btn-soft" data-action="menu">← Accueil</button>
      <button type="button" id="premier-commencer" class="btn btn-primary">Commencer</button>
    </div>
  </div>
</section>

<section id="screen-premier-jeu" class="screen jeu-ecran hidden">
  <div class="jeu-barre">
    <button type="button" id="premier-quitter" class="btn-link">✕ Quitter</button>
    <span id="premier-progression" class="jeu-barre__info"></span>
    <span id="premier-score" class="jeu-barre__score"></span>
  </div>
  <div class="jeu-progres"><div id="premier-barre"></div></div>
  <h1 class="question">Qui est né <span id="premier-sens" class="question__sens"></span>&nbsp;?</h1>
  <div class="duel">
    <button type="button" id="premier-a" class="cadre">
      <span class="cadre__nom"></span><span class="cadre__info"></span><span class="cadre__date"></span>
    </button>
    <button type="button" id="premier-b" class="cadre">
      <span class="cadre__nom"></span><span class="cadre__info"></span><span class="cadre__date"></span>
    </button>
  </div>
  <div class="jeu-pied">
    <p id="premier-verdict" class="verdict" aria-live="polite"></p>
    <button type="button" id="premier-suite" class="btn btn-primary invisible">Suivant →</button>
  </div>
</section>

<section id="screen-premier-fin" class="screen page page--centre hidden">
  <div class="config fin">
    <div class="config__icone" aria-hidden="true">🏆</div>
    <h1>Partie terminée</h1>
    <p id="premier-fin-score" class="fin__score"></p>
    <p id="premier-fin-message" class="fin__message"></p>
    <p id="premier-fin-detail" class="fin__detail"></p>
    <div class="config__actions">
      <button type="button" class="btn btn-soft" data-action="menu">← Accueil</button>
      <button type="button" id="premier-reglages" class="btn btn-soft">Réglages</button>
      <button type="button" id="premier-rejouer" class="btn btn-primary">Rejouer</button>
    </div>
  </div>
</section>

<!-- 0. Commun à tous les jeux (dossier ../COMMUN) : comptes communs, liste des jeux et sélecteur.
        Facultatifs : s'ils manquent, Histehory Quizz se joue en invité, sans sélecteur. -->
<script src="../COMMUN/comptes.js"></script>
<script src="../COMMUN/jeux.js"></script>

<!-- 1. Noyau, compte du joueur et fenêtre du compte (dans cet ordre) -->
<script src="js/core.js"></script>
<script src="js/profils.js"></script>
<script src="js/compte.js"></script>

<!-- 2. Données (personnes, portraits), puis modes de jeu : un fichier par mode, dans js/modes/ -->
<script src="js/donnees/personnes.js"></script>
<script src="js/donnees/portraits.js"></script>
<script src="js/modes/premier.js"></script>

<!-- 3. Accueil (en dernier : il affiche les modes chargés ci-dessus) -->
<script src="js/menu.js"></script>
</body>
</html>
